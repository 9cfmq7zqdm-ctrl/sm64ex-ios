name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install make pkg-config glew glfw libusb gcc@15

      - name: Check for ROM File
        run: |
          if [ ! -f "baserom.us.z64" ]; then
            echo "=== ERROR: ROM FILE MISSING ==="
            echo "Ensure 'baserom.us.z64' is in the root folder (all lowercase)."
            exit 1
          fi

      - name: Force Homebrew GNU Preprocessor
        run: |
          echo "Mapping compiler layouts to Homebrew GNU cpp-15..."
          REAL_GNU_CPP="/opt/homebrew/bin/cpp-15"
          ESCAPED_CPP=$(echo "$REAL_GNU_CPP" | sed 's/\//\\\//g')
          
          find . -name "Makefile*" -type f -exec sed -i '' "s/cpp-12/$ESCAPED_CPP/g" {} +
          find . -name "Makefile*" -type f -exec sed -i '' "s/cpp-10/$ESCAPED_CPP/g" {} +
          find . -name "Makefile*" -type f -exec sed -i '' "s/\$(TARGET_PREFIX)cpp/$ESCAPED_CPP/g" {} +
          find . -name "*.sh" -type f -exec sed -i '' "s/cpp-12/$ESCAPED_CPP/g" {} +
          find . -name "*.sh" -type f -exec sed -i '' "s/cpp-10/$ESCAPED_CPP/g" {} +

      - name: Build Native iOS SDL2 Dependencies
        run: |
          echo "=== STEP: Fetching raw SDL2 framework archive ==="
          cd $GITHUB_WORKSPACE/..
          
          # Target GitHub's codeload cluster to guarantee full source packet delivery
          curl -L https://github.com -o sdl2.zip
          unzip -q sdl2.zip
          
          # Standardize folder naming conventions
          mv SDL-SDL2 SDL_source
          cd SDL_source
          
          echo "=== STEP: Compiling SDL2 library for iOS architecture ==="
          xcodebuild -project Xcode/SDL/SDL.xcodeproj -target "Static Library-iOS" -configuration Release -sdk iphoneos SYMROOT=$PWD/build
          
          # Construct the exact folder tree layout required by sm64ex-ios
          mkdir -p $GITHUB_WORKSPACE/../ioslib/include/SDL2
          mkdir -p $GITHUB_WORKSPACE/../ioslib/lib
          
          # Copy headers and binary files into place
          cp include/*.h $GITHUB_WORKSPACE/../ioslib/include/SDL2/
          cp build/Release-iphoneos/libSDL2.a $GITHUB_WORKSPACE/../ioslib/lib/
          
          echo "=== SDL2 Dependency compilation completed successfully ==="

      - name: Run Native iOS Build Script
        run: |
          chmod +x *.sh tools/* 2>/dev/null || true
          ./build_ios.sh

      - name: Package into iOS IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find . -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "=== ERROR: Build failed to produce an .app package ==="
            exit 1
          fi
          echo "Found application bundle at: $APP_DIR"
          cp -r "$APP_DIR" Payload/
          zip -r sm64ex.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm64ex-ipa
          path: sm64ex.ipa
