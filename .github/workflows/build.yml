name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    # Force the use of an Intel-based Mac environment to ensure legacy tool compatibility
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install make pkg-config sdl2 glew glfw libusb

      - name: Check for ROM File
        run: |
          if [ ! -f "baserom.us.z64" ]; then
            echo "=== ERROR: ROM FILE MISSING ==="
            echo "Ensure 'baserom.us.z64' is in the root folder (all lowercase)."
            exit 1
          fi

      - name: Execute Native Build Script
        run: |
          # Give permissions and run the project's native build file directly
          chmod +x build_ios.sh tools/*.py tools/*.sh 2>/dev/null || true
          ./build_ios.sh

      - name: Package into iOS IPA
        run: |
          mkdir -p Payload
          # Locates the compiled bundle inside the build folders
          APP_DIR=$(find build/ -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "=== ERROR: Build failed to produce an .app package ==="
            exit 1
          fi
          echo "Found application bundle at: $APP_DIR"
          cp -r "$APP_DIR" Payload/
          zip -r sm64ex.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm64ex-ipa
          path: sm64ex.ipa
