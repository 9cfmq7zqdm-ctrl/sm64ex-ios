name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install make pkg-config sdl2 glew glfw libusb gcc

      - name: Fix Missing cpp-12 Compiler Link
        run: |
          # Create a custom local directory that isn't read-only
          mkdir -p $HOME/custom_bin
          
          # Find the actual GNU compiler provided by Homebrew
          REAL_CPP=$(find /opt/homebrew/bin /usr/local/bin -name "cpp-[0-9]*" -type f 2>/dev/null | head -n 1)
          
          # Fallback to system cpp if Homebrew's specific version isn't found
          if [ -z "$REAL_CPP" ]; then
            REAL_CPP=$(which cpp)
          fi
          
          echo "Mapping cpp-12 to safe path destination: $REAL_CPP"
          ln -sf "$REAL_CPP" "$HOME/custom_bin/cpp-12"
          
          # Inject our custom directory straight into the GitHub environment path
          echo "$HOME/custom_bin" >> $GITHUB_PATH

      - name: Check for ROM File
        run: |
          if [ ! -f "baserom.us.z64" ]; then
            echo "=== ERROR: ROM FILE MISSING ==="
            echo "Ensure 'baserom.us.z64' is in the root folder (all lowercase)."
            exit 1
          fi

      - name: Run Build Script
        run: |
          chmod +x *.sh
          make TARGET_IOS=1 -j$(sysctl -n hw.ncpu)

      - name: Package into iOS IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find . -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "=== ERROR: Build failed to produce an .app package ==="
            exit 1
          fi
          echo "Found application bundle at: $APP_DIR"
          cp -r "$APP_DIR" Payload/
          zip -r sm64ex.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm64ex-ipa
          path: sm64ex.ipa
