name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install make pkg-config sdl2 glew glfw libusb

      - name: Check for ROM File
        run: |
          if [ ! -f "baserom.us.z64" ]; then
            echo "=== ERROR: ROM FILE MISSING ==="
            echo "Ensure 'baserom.us.z64' is in the root folder (all lowercase)."
            exit 1
          fi

      - name: Patch Preprocessor References
        run: |
          echo "Redirecting hardcoded preprocessors to system default..."
          # Replaces outdated compiler text references with standard system tools
          find . -name "Makefile*" -type f -exec sed -i '' "s/cpp-12/cpp/g" {} +
          find . -name "Makefile*" -type f -exec sed -i '' "s/cpp-10/cpp/g" {} +
          find . -name "*.sh" -type f -exec sed -i '' "s/cpp-12/cpp/g" {} +
          find . -name "*.sh" -type f -exec sed -i '' "s/cpp-10/cpp/g" {} +

      - name: Run Native iOS Build Script
        run: |
          # Grant execution access to workspace utilities
          chmod +x *.sh tools/* 2>/dev/null || true
          
          # Execute the official native iOS pipeline
          ./build_ios.sh

      - name: Package into iOS IPA
        run: |
          mkdir -p Payload
          # Automatically finds the compiled native app bundle structure
          APP_DIR=$(find . -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "=== ERROR: Build failed to produce an .app package ==="
            exit 1
          fi
          echo "Found application bundle at: $APP_DIR"
          cp -r "$APP_DIR" Payload/
          zip -r sm64ex.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm64ex-ipa
          path: sm64ex.ipa
