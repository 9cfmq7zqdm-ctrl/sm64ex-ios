name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install make pkg-config sdl2 glew glfw libusb gcc

      - name: Fix Missing cpp-12 Compiler Link
        run: |
          # Locate the modern cpp version provided by homebrew
          BREW_BIN_DIR=$(dirname $(which gcc))
          REAL_CPP=$(ls $BREW_BIN_DIR/cpp-* | head -n 1)
          
          if [ -z "$REAL_CPP" ]; then
            REAL_CPP=$(which cpp)
          fi
          
          echo "Mapping hardcoded cpp-12 to actual compiler: $REAL_CPP"
          # Create an alias link in both potential paths so the Makefile finds it
          sudo ln -sf "$REAL_CPP" "$BREW_BIN_DIR/cpp-12"
          sudo ln -sf "$REAL_CPP" /usr/local/bin/cpp-12 2>/dev/null || true

      - name: Check for ROM File
        run: |
          if [ ! -f "baserom.us.z64" ]; then
            echo "=== ERROR: ROM FILE MISSING ==="
            echo "Ensure 'baserom.us.z64' is in the root folder (all lowercase)."
            exit 1
          fi

      - name: Run Build Script
        run: |
          chmod +x *.sh
          # Pass the compiler override directly into the compilation flags
          make TARGET_IOS=1 CPP=cpp -j$(sysctl -n hw.ncpu)

      - name: Package into iOS IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find . -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "=== ERROR: Build failed to produce an .app package ==="
            exit 1
          fi
          echo "Found application bundle at: $APP_DIR"
          cp -r "$APP_DIR" Payload/
          zip -r sm64ex.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm64ex-ipa
          path: sm64ex.ipa
