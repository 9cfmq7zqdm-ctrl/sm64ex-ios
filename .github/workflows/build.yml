name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install make pkg-config glew glfw libusb gcc@15 mingw-w64

      - name: Check for ROM File
        run: |
          if [ ! -f "baserom.us.z64" ]; then
            echo "=== ERROR: ROM FILE MISSING ==="
            echo "Ensure 'baserom.us.z64' is in the root folder (all lowercase)."
            exit 1
          fi

      - name: Force Homebrew GNU Preprocessor
        run: |
          echo "Mapping compiler layouts to Homebrew GNU cpp-15..."
          REAL_GNU_CPP="/opt/homebrew/bin/cpp-15"
          ESCAPED_CPP=$(echo "$REAL_GNU_CPP" | sed 's/\//\\\//g')
          
          find . -name "Makefile*" -type f -exec sed -i '' "s/cpp-12/$ESCAPED_CPP/g" {} +
          find . -name "Makefile*" -type f -exec sed -i '' "s/cpp-10/$ESCAPED_CPP/g" {} +
          find . -name "Makefile*" -type f -exec sed -i '' "s/\$(TARGET_PREFIX)cpp/$ESCAPED_CPP/g" {} +
          find . -name "*.sh" -type f -exec sed -i '' "s/cpp-12/$ESCAPED_CPP/g" {} +
          find . -name "*.sh" -type f -exec sed -i '' "s/cpp-10/$ESCAPED_CPP/g" {} +

      - name: Route Audio Assembler to Absolute Path GNU Toolchain
        run: |
          echo "Locating Homebrew MingW cross-assembler path..."
          MINGW_AS=$(which x86_64-w64-mingw32-as || echo "/opt/homebrew/bin/x86_64-w64-mingw32-as")
          echo "Found target assembler at: $MINGW_AS"
          ESCAPED_AS=$(echo "$MINGW_AS" | sed 's/\//\\\//g')
          find . -name "Makefile*" -type f -exec sed -i '' "s/i686-w64-mingw32-as/$ESCAPED_AS/g" {} +

      - name: Hard-Patch Graphics Code Pointer Mismatch
        run: |
          echo "Injecting compiler warnings bypass directly into graphics source code..."
          sed -i '' '1s/^/#pragma clang diagnostic ignored "-Wincompatible-function-pointer-types"\n#pragma clang diagnostic ignored "-Wdeprecated-declarations"\n/' src/pc/gfx/gfx_opengl.c

      - name: Patch Modern Clang Pointer Restrictions Natively
        run: |
          echo "Injecting ignore-error flags directly into active compilation flags..."
          find . -name "Makefile*" -type f -exec sed -i '' 's/-fno-strict-aliasing/-fno-strict-aliasing -Wno-incompatible-function-pointer-types -Wno-implicit-function-declaration -Wno-error -Wno-deprecated-declarations/g' {} +

      - name: Build Native iOS SDL2 Dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== STEP: Cloning SDL2 repository via GitHub CLI ==="
          gh repo clone libsdl-org/SDL $GITHUB_WORKSPACE/../SDL_source -- --branch SDL2 --depth 1
          cd $GITHUB_WORKSPACE/../SDL_source
          
          echo "=== STEP: Compiling SDL2 library for iOS architecture ==="
          xcodebuild -project Xcode/SDL/SDL.xcodeproj -target "Static Library-iOS" -configuration Release -sdk iphoneos SYMROOT=$PWD/build
          
          echo "=== STEP: Deploying SDL2 files to all relative search paths ==="
          mkdir -p $GITHUB_WORKSPACE/ioslib/lib
          mkdir -p $GITHUB_WORKSPACE/ioslib/include/SDL2
          cp include/*.h $GITHUB_WORKSPACE/ioslib/include/SDL2/
          cp build/Release-iphoneos/libSDL2.a $GITHUB_WORKSPACE/ioslib/lib/

      - name: Step 1 - Build Background Asset Tools
        run: |
          chmod +x tools/* 2>/dev/null || true
          make -C tools

      - name: Step 2 - Extract Assets from ROM
        run: |
          python3 extract_assets.py us

      - name: Step 3 - Native Workspace Compilation (Bypassing Xcode)
        run: |
          echo "=== STEP: Direct terminal application compilation ==="
          # Compile using clean system parameters directly via parallel processing threads
          make TARGET_IOS=1 -j$(sysctl -n hw.ncpu)

      - name: Step 4 - Custom Manifest Assembly and Packaging
        run: |
          echo "=== STEP: Compiling structural .app container manually ==="
          mkdir -p Payload/sm64ios.app
          
          # 1. Transfer the compiled operational core binary file
          cp build/us_pc/sm64ios Payload/sm64ios.app/
          
          # 2. Transfer interface mapping definitions and interface manifests
          cp -R build/us_pc/Base.lproj Payload/sm64ios.app/ 2>/dev/null || cp -R sm64ios/Base.lproj Payload/sm64ios.app/
          cp sm64ios/Info.plist Payload/sm64ios.app/ 2>/dev/null || true
          
          # 3. Compress container into structural iOS file wrapper
          zip -r sm64ex.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm64ex-ipa
          path: sm64ex.ipa
