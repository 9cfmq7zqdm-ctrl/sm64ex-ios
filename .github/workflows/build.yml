name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install make pkg-config glew glfw libusb gcc@15

      - name: Check for ROM File
        run: |
          if [ ! -f "baserom.us.z64" ]; then
            echo "=== ERROR: ROM FILE MISSING ==="
            echo "Ensure 'baserom.us.z64' is in the root folder (all lowercase)."
            exit 1
          fi

      - name: Force Homebrew GNU Preprocessor
        run: |
          echo "Mapping compiler layouts to Homebrew GNU cpp-15..."
          REAL_GNU_CPP="/opt/homebrew/bin/cpp-15"
          ESCAPED_CPP=$(echo "$REAL_GNU_CPP" | sed 's/\//\\\//g')
          
          find . -name "Makefile*" -type f -exec sed -i '' "s/cpp-12/$ESCAPED_CPP/g" {} +
          find . -name "Makefile*" -type f -exec sed -i '' "s/cpp-10/$ESCAPED_CPP/g" {} +
          find . -name "Makefile*" -type f -exec sed -i '' "s/\$(TARGET_PREFIX)cpp/$ESCAPED_CPP/g" {} +
          find . -name "*.sh" -type f -exec sed -i '' "s/cpp-12/$ESCAPED_CPP/g" {} +
          find . -name "*.sh" -type f -exec sed -i '' "s/cpp-10/$ESCAPED_CPP/g" {} +

      - name: Patch Modern Clang Pointer Restrictions Natively
        run: |
          echo "Injecting ignore-error flags directly into active compilation flags..."
          find . -name "Makefile*" -type f -exec sed -i '' 's/-fno-strict-aliasing/-fno-strict-aliasing -Wno-incompatible-function-pointer-types -Wno-implicit-function-declaration -Wno-error -Wno-deprecated-declarations/g' {} +

      - name: Build Native iOS SDL2 Dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== STEP: Cloning SDL2 repository via GitHub CLI ==="
          gh repo clone libsdl-org/SDL $GITHUB_WORKSPACE/../SDL_source -- --branch SDL2 --depth 1
          cd $GITHUB_WORKSPACE/../SDL_source
          
          echo "=== STEP: Compiling SDL2 library for iOS architecture ==="
          xcodebuild -project Xcode/SDL/SDL.xcodeproj -target "Static Library-iOS" -configuration Release -sdk iphoneos SYMROOT=$PWD/build
          
          mkdir -p $GITHUB_WORKSPACE/../ioslib/include/SDL2
          mkdir -p $GITHUB_WORKSPACE/../ioslib/lib
          
          cp include/*.h $GITHUB_WORKSPACE/../ioslib/include/SDL2/
          cp build/Release-iphoneos/libSDL2.a $GITHUB_WORKSPACE/../ioslib/lib/

      - name: Step 1 - Build Background Asset Tools
        run: |
          chmod +x tools/* 2>/dev/null || true
          make -C tools

      - name: Step 2 - Extract Assets from ROM
        run: |
          # Explicitly trigger texture and layout extraction before calling Xcode
          python3 extract_assets.py us

      - name: Step 3 - Force Direct Xcode Compilation (No Signing)
        run: |
          echo "=== STEP: Compiling via Apple Xcode Toolchain ==="
          # Compiles the workspace structure bypassing cloud signature walls
          xcodebuild -workspace sm64ios.xcworkspace -scheme sm64ios -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" SYMROOT=$PWD/build

      - name: Step 4 - Package into iOS IPA
        run: |
          mkdir -p Payload
          # Locate the compiled bundle structure inside the explicit Xcode build tree
          APP_DIR=$(find build/ -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "=== ERROR: Build failed to produce an .app package ==="
            exit 1
          fi
          echo "Found application bundle at: $APP_DIR"
          cp -r "$APP_DIR" Payload/
          zip -r sm64ex.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm64ex-ipa
          path: sm64ex.ipa
