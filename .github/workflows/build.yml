name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install make pkg-config sdl2 glew glfw libusb gcc

      - name: Patch Code to Use Modern GCC Preprocessor
        run: |
          # Dynamically locate the actual modern GNU preprocessor installed by Homebrew (like cpp-16)
          GNU_CPP=$(ls /opt/homebrew/bin/cpp-[0-9]* /usr/local/bin/cpp-[0-9]* 2>/dev/null | head -n 1)
          if [ -z "$GNU_CPP" ]; then
            echo "=== ERROR: GNU Preprocessor from Homebrew not found ==="
            exit 1
          fi
          echo "Found stable GNU preprocessor: $GNU_CPP"
          ESCAPED_CPP=$(echo "$GNU_CPP" | sed 's/\//\\\//g')
          
          # Globally replace the old hardcoded text 'cpp-12' and 'cpp-10' across all configuration files
          find . -name "Makefile*" -type f -exec sed -i '' "s/cpp-12/$ESCAPED_CPP/g" {} +
          find . -name "Makefile*" -type f -exec sed -i '' "s/cpp-10/$ESCAPED_CPP/g" {} +

      - name: Check for ROM File
        run: |
          if [ ! -f "baserom.us.z64" ]; then
            echo "=== ERROR: ROM FILE MISSING ==="
            echo "Ensure 'baserom.us.z64' is in the root folder (all lowercase)."
            exit 1
          fi

      - name: Step 1 - Build Background Asset Tools
        run: |
          # Compile the tools folder first so the asset extractor has its processing utilities ready
          chmod +x tools/* 2>/dev/null || true
          make -C tools

      - name: Step 2 - Extract Assets from ROM
        run: |
          # Create target folders upfront to avoid filesystem race conditions
          mkdir -p build/us_pc
          
          # Run the official asset extractor to unpack textures and generate header maps
          python3 extract_assets.py us

      - name: Step 3 - Compile Game Binaries
        run: |
          # Run the clean compile rule manually, bypassing the broken build.sh script
          make TARGET_IOS=1 -j$(sysctl -n hw.ncpu)

      - name: Step 4 - Package into iOS IPA
        run: |
          mkdir -p Payload
          # Automatically scans the project workspace to find the compiled .app file bundle
          APP_DIR=$(find . -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "=== ERROR: Build failed to produce an .app package ==="
            exit 1
          fi
          echo "Found application bundle at: $APP_DIR"
          cp -r "$APP_DIR" Payload/
          zip -r sm64ex.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm64ex-ipa
          path: sm64ex.ipa
